  <!-- ===== POST ===== -->
  <section class="section post-section">
    <div class="container post-container">
      <a href="./" class="back-link"><i class="fas fa-arrow-left"></i> All posts</a>
      <div id="post-loading" class="post-loading">Loading…</div>
      <article id="post-article" class="post-article" hidden>
        <div class="post-meta-top">
          <span id="post-date" class="post-date"></span>
        </div>
        <h1 id="post-title" class="post-title"></h1>
        <div id="post-tags" class="tech-tags post-tags"></div>
        <div id="post-body" class="post-body"></div>
      </article>
      <div id="post-error" class="post-error" hidden>
        <p>Couldn't find that post. <a href="./">Back to all posts</a></p>
      </div>
    </div>
  </section>

  <script src="../js/main.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const loadingEl = document.getElementById('post-loading');
      const articleEl = document.getElementById('post-article');
      const errorEl = document.getElementById('post-error');

      if (!slug) {
        loadingEl.hidden = true;
        errorEl.hidden = false;
        return;
      }

      try {
        const manifestRes = await fetch('manifest.json');
        const manifest = await manifestRes.json();
        const post = manifest.find(p => p.slug === slug);
        if (!post) throw new Error('Post not found in manifest');

        const mdRes = await fetch(`content/${slug}.md`);
        if (!mdRes.ok) throw new Error('Post content not found');
        const mdText = await mdRes.text();

        document.title = `${post.title} — Nidhi Berde`;
        document.getElementById('post-date').textContent = new Date(post.date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('post-title').textContent = post.title;
        document.getElementById('post-tags').innerHTML = (post.tags || []).map(t => `<span class="tag-sm">${t}</span>`).join('');
        document.getElementById('post-body').innerHTML = marked.parse(mdText);

        loadingEl.hidden = true;
        articleEl.hidden = false;
      } catch (err) {
        console.error(err);
        loadingEl.hidden = true;
        errorEl.hidden = false;
      }
    })();
  </script>
</body>
