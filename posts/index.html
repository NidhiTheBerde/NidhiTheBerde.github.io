  <!-- ===== BLOG HERO ===== -->
  <section class="section posts-hero">
    <div class="container">
      <h1 class="section-title">Technical Posts</h1>
      <p class="posts-intro">A running tech diary — things I built, broke, debugged, or learned. Not polished, just real.</p>
    </div>
  </section>

  <!-- ===== POST LIST ===== -->
  <section class="section posts-list-section">
    <div class="container">
      <div id="posts-list" class="posts-grid">
        <p>Loading posts…</p>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container footer-inner">
      <p>Designed &amp; Built by <strong>Nidhi Berde</strong></p>
      <div class="footer-social">
        <a href="https://www.linkedin.com/in/nidhi-berde/" target="_blank" rel="noopener" aria-label="LinkedIn">
          <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="https://github.com/NidhiTheBerde" target="_blank" rel="noopener" aria-label="GitHub">

        <a href="mailto:nishiberde1998@gmail.com" aria-label="Email">
          <i class="fas fa-envelope"></i>
        </a>
      </div>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    (async function () {
      const listEl = document.getElementById('posts-list');
      try {
        const res = await fetch('manifest.json');
        const posts = await res.json();
        posts.sort((a, b) => b.date.localeCompare(a.date));

        if (!posts.length) {
          listEl.innerHTML = '<p>No posts yet — check back soon.</p>';
          return;
        }

        listEl.innerHTML = posts.map(post => `
          <a class="post-card" href="post.html?slug=${encodeURIComponent(post.slug)}">
            <span class="post-card-date">${new Date(post.date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
            <h3 class="post-card-title">${post.title}</h3>
            <p class="post-card-excerpt">${post.excerpt}</p>
            <div class="tech-tags">${(post.tags || []).map(t => `<span class="tag-sm">${t}</span>`).join('')}</div>
          </a>
        `).join('');
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<p>Couldn\'t load posts right now.</p>';
      }
    })();
  </script>
</body>
